<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オセロ vs Ollama AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<h1>オセロ: プレイヤー vs Ollama AI</h1>

<div id="setup">
  <label>自分の色:
    <select id="human-color">
      <option value="black">黒(先手)</option>
      <option value="white">白(後手)</option>
    </select>
  </label>
  <label>対戦相手モデル:
    <select id="ai-model"></select>
  </label>
  <button id="refresh-models-btn" type="button">モデル一覧更新</button>
  <button id="new-game-btn" type="button">新しい対局</button>
</div>

<div id="status">モデルを選んで「新しい対局」を押してください。</div>
<div id="board"></div>

<div id="log-panel">
  <div id="log-panel-header">
    <h3>対局ログ</h3>
    <button id="copy-log-btn" type="button">ログをコピー</button>
  </div>
  <div id="log"></div>
</div>

<script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
